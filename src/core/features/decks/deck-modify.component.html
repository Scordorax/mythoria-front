<div class="container mt-3">

    <app-loader *ngIf="loading"></app-loader>

    <div *ngIf="!loading">

        <h2>Modifier le deck</h2>

        <!-- Nom du deck -->
        <div class="mb-3">
            <input [(ngModel)]="deckName" class="form-control" placeholder="Nom du deck">
        </div>

        <div class="row">

            <!-- COLLECTION -->
            <div class="col-md-6">
                <h4 class="mb-3">Collection disponible</h4>

                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        *ngFor="let card of allCards">

                        <span>{{ card.cardName }} ({{ card.quantity }})</span>

                        <button class="btn btn-sm btn-primary" (click)="addCardToDeck(card)"
                            [disabled]="isMaxReached(card)">
                            Ajouter
                        </button>

                    </li>
                </ul>
            </div>

            <!-- DECK -->
            <div class="col-md-6">
                <h4 class="mb-3">Cartes dans le deck</h4>

                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        *ngFor="let c of deckCards">

                        <span>{{ c.card.cardName }} x{{ c.quantity }}</span>

                        <button class="btn btn-sm btn-danger" (click)="decrease(c.card.cardId)">
                            Supprimer
                        </button>

                    </li>
                </ul>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="mt-3 text-end">
            <button class="btn btn-success me-2" (click)="saveDeck()">Enregistrer modification</button>
            <button class="btn btn-secondary" (click)="cancel()">Annuler modification</button>
        </div>

    </div>
</div>
