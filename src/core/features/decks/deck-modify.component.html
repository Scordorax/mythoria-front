<div class="container mt-4">
    <h2 class="mb-4 text-center">Modification du Deck</h2>

    <!-- Nom du deck -->
    <div class="mb-4">
        <label for="deckName" class="form-label">Nom du deck</label>
        <input type="text" id="deckName" class="form-control" [(ngModel)]="deckName" placeholder="Nom du deck">
    </div>

    <div class="row">
        <!-- Cartes disponibles -->
        <div class="col-md-6">
            <h4 class="mb-3">Collection disponible</h4>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    *ngFor="let card of filteredCards">
                    <span>{{ card.cardName }} ({{ card.quantity }})</span>
                    <button class="btn btn-sm btn-primary" (click)="addCardToDeck(card)">
                        Ajouter
                    </button>
                </li>
            </ul>
        </div>

        <!-- Cartes dans le deck -->
        <div class="col-md-6">
            <h4 class="mb-3">Cartes dans le deck</h4>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    *ngFor="let c of deckCards">
                    <span>{{ c.card.cardName }} x{{ c.quantity }}</span>
                    <button class="btn btn-sm btn-danger" (click)="removeCardFromDeck(c.card.cardId)">
                        Supprimer
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <!-- Boutons -->
    <div class="mt-4 text-center">
        <button class="btn btn-success" (click)="saveDeck()">Enregistrer les modifications</button>
        <button class="btn btn-secondary ms-2" (click)="cancel()">Annuler</button>
    </div>
</div>
