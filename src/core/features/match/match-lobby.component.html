<div class="lobby-container">

    <h1>🎮 Match Lobby</h1>

    <!-- 🎯 DIFFICULTÉ -->
    <div class="section">
        <h2>Difficulté IA</h2>

        <div class="difficulty-buttons">
            <button [class.active]="difficulty === 'easy'" (click)="selectDifficulty('easy')">
                🟢 Facile
            </button>

            <button [class.active]="difficulty === 'medium'" (click)="selectDifficulty('medium')">
                🟡 Moyen
            </button>

            <button [class.active]="difficulty === 'expert'" (click)="selectDifficulty('expert')">
                🔴 Expert
            </button>
        </div>
    </div>

    <div class="section">
        <h2>🎴 Choisir un deck</h2>

        <div class="deck-list">

            <div class="deck-card" *ngFor="let deck of decks" [class.selected]="selectedDeck?.deckId === deck.deckId"
                (click)="selectDeck(deck)">
                <h3>{{ deck.name }}</h3>
                <p>{{ deck.cards?.length || 0 }} cartes</p>
            </div>

        </div>
    </div>

    <!-- 🚀 BOUTON START -->
    <div class="section">
        <button class="start-button" (click)="createMatch()" [disabled]="loading">

            <span *ngIf="!loading">🚀 Lancer le match</span>
            <span *ngIf="loading">⏳ Création...</span>

        </button>
    </div>

    <!-- ❌ ERREUR -->
    <div *ngIf="error" class="error">
        {{ error }}
    </div>

</div>
