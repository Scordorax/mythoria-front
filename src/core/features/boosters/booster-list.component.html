<div class="booster-list-container mt-5">
  <div class="booster-scroll d-flex">
    <div class="booster-card" *ngFor="let booster of boosters">
      
      <!-- Image du booster -->
      <div class="booster-image">
        <img src="assets/image/booster.png" [alt]="'Booster ' + booster.name">
      </div>
      
      <!-- Nom et prix -->
      <h6 class="text-white mt-2">{{ booster.name }}</h6>
      <p class="text-white fw-bold">{{ booster.price }} €</p>
      
      <!-- Bouton ouvrir -->
      <button class="btn btn-outline-light btn-sm mt-1 w-100" (click)="openBooster(booster)">
        Ouvrir
      </button>
    </div>
  </div>
</div>
