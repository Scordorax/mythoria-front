<div class="card bg-dark text-white p-2 m-2 shadow-sm" style="width: 150px;">
  <img [src]="image" class="card-img-top mb-2" alt="{{ name }}">
  <div class="card-body p-2">
    <h6 class="card-title">{{ name }}</h6>
    <p class="card-text mb-0">Type: {{ type }}</p>
    <p class="card-text">Rareté: {{ rarity }}</p>
  </div>
</div>
